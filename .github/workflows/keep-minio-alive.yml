name: Keep MinIO Alive

on:
  schedule:
    # Every 10 minutes (Render sleeps after 15 min of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-minio:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MinIO health endpoint
        run: |
          echo "Pinging MinIO health endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://loanflow-minio.onrender.com/minio/health/live)
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ MinIO is alive (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ MinIO returned HTTP $HTTP_STATUS (may be cold starting)"
          fi
          
      - name: Retry on failure
        if: failure()
        run: |
          echo "Waiting 30s for cold start..."
          sleep 30
          curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://loanflow-minio.onrender.com/minio/health/live
          echo ""
