name: Keep Render services awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: curl -f -s -o /dev/null -w "%{http_code}" https://arogan-mx0n.onrender.com/health || echo "Backend ping failed"

      - name: Ping frontend
        run: curl -f -s -o /dev/null -w "%{http_code}" https://loanflow-frontend-z67v.onrender.com/ || echo "Frontend ping failed"
