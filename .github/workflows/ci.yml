name: CI/CD Pipeline

on:
  push:
    branches: [main, stage, prod]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Backend Lint
        run: npm run lint:check
        working-directory: backend

      - name: Backend Typecheck
        run: npm run typecheck
        working-directory: backend

      - name: Frontend Lint
        run: npm run lint:check
        working-directory: frontend

      - name: Frontend Typecheck
        run: npm run typecheck
        working-directory: frontend

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loanflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Run Backend Tests
        run: npm test -- --coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loanflow_test?schema=public&sslmode=disable
          JWT_ACCESS_SECRET: test-access-secret-key-for-testing-only-32chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-only-32chars
          NODE_ENV: test

      - name: Run Frontend Tests
        run: npm test -- --coverage
        working-directory: frontend

  build:
    name: Build & Push
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: loanflow/app
          tags: |
            type=ref,event=branch
            type=sha,format=long
            latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: loanflow/backend:${{ steps.meta.tags }}
          labels: ${{ steps.meta.labels }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: loanflow/frontend:${{ steps.meta.tags }}
          labels: ${{ steps.meta.labels }}
