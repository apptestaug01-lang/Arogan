services:
  postgres:
    image: postgres:16-alpine
    container_name: loanflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loanflow
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loanflow-backend
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/loanflow?schema=public&sslmode=disable'
      JWT_ACCESS_SECRET: 'change-this-to-a-secure-random-secret-in-production'
      JWT_REFRESH_SECRET: 'change-this-to-a-different-secure-random-secret'
      JWT_ACCESS_EXPIRES_IN: '15m'
      JWT_REFRESH_EXPIRES_IN: '7d'
      BCRYPT_COST: '12'
      OTP_EXPIRY_SECONDS: '60'
      OTP_MAX_REQUESTS_PER_WINDOW: '5'
      OTP_WINDOW_MINUTES: '10'
      MAX_FAILED_ATTEMPTS: '5'
      LOCKOUT_MINUTES: '15'
      RATE_LIMIT_WINDOW_MS: '60000'
      RATE_LIMIT_MAX: '5'
      PORT: '4000'
      NODE_ENV: 'production'
      CORS_ORIGIN: 'http://localhost:5173'
      FRONTEND_URL: 'http://localhost:5173'
      BREVO_SMTP_USER: ${BREVO_SMTP_USER}
      BREVO_SMTP_PASS: ${BREVO_SMTP_PASS}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME}
      BREVO_REPLY_TO: ${BREVO_REPLY_TO}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loanflow-frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: 'http://localhost:4000/api'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
