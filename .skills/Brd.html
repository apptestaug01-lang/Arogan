**Version:** 2.0

## 1. Introduction

### 1.1 Project Overview
LoanFlow is a digital platform for managing loan applications, document storage, and role-based workflows. It serves borrowers, credit analysts, credit approvers, and administrators. The platform simplifies the loan lifecycle—from application submission to approval and monitoring.

This BRD covers **authentication and onboarding** (Login & Signup) as the first phase. All enhancements are designed to ensure a production‑ready, secure, and scalable system.

### 1.2 Business Objectives
- Provide a secure and user-friendly authentication experience.
- Enable role-based access control for different user types.
- Support both password and OTP-based login (for enhanced security).
- Allow users to sign up with their role (Borrower, Admin, Credit Analyst, Credit Approver).
- Enforce strong validation and data integrity.
- Set the foundation for a scalable, cloud‑native application with robust monitoring, logging, and compliance.

### 1.3 Scope
**In Scope (Phase 1):**
- User registration (signup) with mandatory fields: full name, email, mobile (Indian number), password, confirm password, and role selection.
- User login via email or mobile number with password.
- User login via OTP sent to email or mobile (Indian number).
- Role-based user creation.
- Input validation and error handling.
- Session management (remember me with configurable expiry).
- Password strength enforcement.
- OTP rate limiting and expiration.
- Basic account lockout after multiple failed attempts.
- Email verification (optional, but recommended for enhanced security).

**Out of Scope (Phase 1):**
- Dashboard, loan management, document upload, consent management.
- Admin panel for user management.
- Multi-factor authentication (beyond OTP).
- Integration with external identity providers (e.g., Google, LinkedIn).
- Password reset flow (deferred to Phase 2 but design should be extensible).

## 7. User Journeys (Updated)

### 7.1 Signup Journey
1. User visits \`/signup\`.
2. Fills in required fields.
3. Clicks "Create Account".
4. System validates input (including email format, mobile format, password strength).
5. If valid, hashes password, creates user record with role.
6. (Optional) Sends email verification link.
7. Redirects to login page with success message.

### 7.2 Login (Password) Journey
1. User visits \`/login\`.
2. Enters email/mobile and password.
3. System checks if account is locked; if locked, shows remaining time.
4. Validates credentials against stored hash.
5. On success, generates access and refresh tokens; sets cookies; updates lastLoginAt.
6. On failure, increments failedAttempts; if >5, locks account for 15 min.
7. Redirects to dashboard with role-specific view.

### 7.3 Login (OTP) Journey
1. User selects OTP tab.
2. Enters email/mobile.
3. Clicks "Send OTP".
4. System validates identifier existence (but doesn't reveal) and checks rate limit.
5. Generates 6-digit OTP, hashes, stores in DB/Redis with TTL.
6. Sends OTP via SMS/email.
7. User enters OTP in the six fields.
8. System verifies OTP (hash match, not expired, not used).
9. On success, logs user in (creates session), marks OTP as used.
10. On failure, shows error; allows resend after expiry.

## 9. Security Considerations (Deep Dive)

- **Password Reset**: Deferred to Phase 2, but the user model includes \`resetToken\` and \`resetTokenExpiry\` fields (not shown).
- **OTP Security**: OTPs are generated using a cryptographically secure pseudo-random number generator (CSPRNG). Hashed with bcrypt or SHA-256 with salt.
- **JWT Best Practices**: Short-lived access tokens (15 min) and long-lived refresh tokens (7 days) stored in HTTP‑only cookies. Refresh token rotation on each refresh.
- **CORS**: Restrict to allowed frontend domains.
- **Rate Limiting**: Implement per IP and per user (for authenticated endpoints) using middleware like \`express-rate-limit\`.
- **Data Validation**: Use Joi or Zod for server-side validation.
- **SQL Injection**: Prisma parameterized queries prevent injection.
- **XSS & CSRF**: Use helmet.js; CSRF protection via same‑site cookies or anti‑CSRF tokens.

## 13. Risks and Mitigation

| Risk                                      | Mitigation                                                                 |
|-------------------------------------------|----------------------------------------------------------------------------|
| SMS/email OTP delivery failures           | Implement retry logic with exponential backoff; fallback to email if SMS fails. |
| Brute-force attacks on login              | Rate limiting + account lockout; CAPTCHA for excessive attempts.           |
| Database downtime                         | Multi‑AZ RDS deployment with automatic failover.                           |
| JWT token theft                           | Short-lived tokens, refresh rotation, token revocation on logout.          |
| Non‑compliant data handling               | Enforce GDPR/IT Act from design; conduct privacy impact assessment.        |

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastMsg').textContent = msg;
            icon.textContent = isError ? '✕' : '✓';
            icon.className = 'toast-icon' + (isError ? ' error' : '');
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => {
                t.classList.remove('show');
            }, 4000);
        }

        const tabs = document.querySelectorAll('.tab');
        const passwordForm = document.getElementById('passwordForm');
        const otpForm = document.getElementById('otpForm');

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                tabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                if (this.dataset.tab === 'password') {
                    passwordForm.classList.remove('hidden');
                    otpForm.classList.add('hidden');
                } else {
                    passwordForm.classList.add('hidden');
                    otpForm.classList.remove('hidden');
                    resetOTPUI();
                }
            });
        });

        let otpTimer = null;
        let timerSeconds = 30;
        let isOTPSent = false;
        let generatedOTP = '123456';

        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const otpInputSection = document.getElementById('otpInputSection');
        const timerText = document.getElementById('timerText');
        const timerCountdown = document.getElementById('timerCountdown');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const otpInputs = document.querySelectorAll('#otpGroup .input');

        function resetOTPUI() {
            clearInterval(otpTimer);
            isOTPSent = false;
            otpInputSection.style.display = 'none';
            timerText.style.display = 'none';
            sendOtpBtn.querySelector('.btn-text').textContent = 'Send OTP';
            sendOtpBtn.disabled = false;
            verifyOtpBtn.disabled = false;
            otpInputs.forEach(input => { input.value = ''; input.disabled = true; });
            document.getElementById('otpIdentifier').disabled = false;
        }

        otpInputs.forEach((input, index) => {
            input.addEventListener('input', function(e) {
                if (this.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
                const allFilled = Array.from(otpInputs).every(inp => inp.value.length === 1);
                verifyOtpBtn.disabled = !allFilled;
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value === '' && index > 0) {
                    otpInputs[index - 1].focus();
                }
                if (e.key < '0' || e.key > '9') {
                    if (e.key !== 'Backspace' && e.key !== 'Tab' && e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') {
                        e.preventDefault();
                    }
                }
            });
            input.addEventListener('paste', (e) => e.preventDefault());
        });

        function sendOTP() {
            const identifier = document.getElementById('otpIdentifier').value.trim();
            if (!identifier) {
                showToast('Please enter your email or mobile number', true);
                document.getElementById('otpIdentifier').focus();
                return;
            }
            const isEmail = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(identifier);
            const isMobile = /^[6-9]\\d{9}$/.test(identifier.replace(/\\s/g, ''));
            if (!isEmail && !isMobile) {
                showToast('Please enter a valid email or Indian mobile number', true);
                document.getElementById('otpIdentifier').focus();
                return;
            }

            sendOtpBtn.disabled = true;
            sendOtpBtn.querySelector('.btn-text').textContent = 'Sending...';
            sendOtpBtn.classList.add('loading');

            setTimeout(() => {
                sendOtpBtn.classList.remove('loading');
                sendOtpBtn.querySelector('.btn-text').textContent = 'OTP Sent ✓';
                isOTPSent = true;
                showToast(\`OTP sent to \${identifier}\`);
                otpInputSection.style.display = 'block';
                timerText.style.display = 'block';
                otpInputs.forEach(input => { input.disabled = false; input.value = ''; });
                otpInputs[0].focus();

                timerSeconds = 30;
                timerCountdown.textContent = timerSeconds;
                clearInterval(otpTimer);
                otpTimer = setInterval(() => {
                    timerSeconds--;
                    timerCountdown.textContent = timerSeconds;
                    if (timerSeconds <= 0) {
                        clearInterval(otpTimer);
                        timerText.style.display = 'none';
                        sendOtpBtn.disabled = false;
                        sendOtpBtn.querySelector('.btn-text').textContent = 'Resend OTP';
                        showToast('OTP expired. Please request a new one.', true);
                    }
                }, 1000);

                setTimeout(() => {
                    if (sendOtpBtn.disabled === false) {
                        sendOtpBtn.querySelector('.btn-text').textContent = 'Resend OTP';
                    }
                }, 2000);
            }, 1500);
        }

        function handleOTPLogin(e) {
            e.preventDefault();
            const otpCode = Array.from(otpInputs).map(inp => inp.value).join('');
            if (otpCode.length !== 6) {
                showToast('Please enter the complete 6-digit OTP', true);
                return;
            }
            verifyOtpBtn.disabled = true;
            verifyOtpBtn.classList.add('loading');
            setTimeout(() => {
                verifyOtpBtn.classList.remove('loading');
                if (otpCode === generatedOTP) {
                    showToast('✅ OTP verified! Welcome back.');
                } else {
                    showToast('Invalid OTP. Please try again.', true);
                    verifyOtpBtn.disabled = false;
                }
            }, 1200);
        }

        function handlePasswordLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('passwordLoginBtn');

            document.querySelectorAll('#loginForm .input').forEach(el => el.classList.remove('invalid'));

            if (!identifier) {
                document.getElementById('loginIdentifier').classList.add('invalid');
                showToast('Email or Mobile is required', true);
                document.getElementById('loginIdentifier').focus();
                return;
            }
            const isEmail = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(identifier);
            const isMobile = /^[6-9]\\d{9}$/.test(identifier.replace(/\\s/g, ''));
            if (!isEmail && !isMobile) {
                document.getElementById('loginIdentifier').classList.add('invalid');
                showToast('Please enter a valid email or Indian mobile number', true);
                document.getElementById('loginIdentifier').focus();
                return;
            }
            if (!password || password.length < 6) {
                document.getElementById('loginPassword').classList.add('invalid');
                showToast('Password must be at least 6 characters', true);
                document.getElementById('loginPassword').focus();
                return;
            }

            btn.disabled = true;
            btn.classList.add('loading');
            setTimeout(() => {
                btn.classList.remove('loading');
                btn.disabled = false;
                showToast(\`✅ Welcome back, \${identifier.split('@')[0] || 'User'}!\`);
            }, 1500);
        }

        document.getElementById('signupLink').addEventListener('click', function(e) {
            e.preventDefault();
            showToast('📝 Redirecting to Signup...');
            setTimeout(() => {
                showToast('🚀 Navigate to Signup page (mock)');
            }, 500);
        });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loginIdentifier').value = 'jordan.reyes@acmecorp.com';
            document.getElementById('loginPassword').value = 'Demo@1234';
            document.getElementById('otpIdentifier').value = '9876543210';
            generatedOTP = String(Math.floor(100000 + Math.random() * 900000));
            console.log('🔑 Mock OTP for testing:', generatedOTP);
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active && active.closest('#otpGroup')) {
                    const allFilled = Array.from(otpInputs).every(inp => inp.value.length === 1);
                    if (allFilled) {
                        document.getElementById('verifyOtpBtn').click();
                    }
                }
            }
        });
    <\/script>

            background: var(--surface);
            color: var(--fg);
            outline: none;
            cursor: pointer;
            appearance: auto;
        }
        .mobile-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.08);
        }
        .mobile-group .input { flex: 1; }
        .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 4px;
        }
        .role-tile {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            cursor: pointer;
            transition: all 0.15s;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted-fg);
        }
        .role-tile:hover {
            border-color: var(--primary);
            background: var(--muted);
        }
        .role-tile.selected {
            border-color: var(--primary);
            background: var(--primary);
            color: var(--primary-fg);
        }
        .role-tile .role-emoji { font-size: 18px; line-height: 1; }
        .role-tile input[type="radio"] { display: none; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            height: 44px;
            padding: 0 16px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
            font-family: var(--font);
        }
        .btn-primary {
            background: var(--primary);
            color: var(--primary-fg);
        }
        .btn-primary:hover { background: #27272a; }
        .signup-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--muted-fg);
        }
        .signup-footer a {
            color: var(--fg);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .signup-footer a:hover { color: var(--primary); }
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 5000;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            max-width: 90%;
        }
        #toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .toast-icon {
            color: var(--success);
            font-weight: 700;
            font-size: 16px;
        }
        .toast-icon.error { color: var(--destructive); }
        @media (max-width: 480px) {
            .signup-card { padding: 28px 20px 24px; }
            .signup-title { font-size: 20px; }
            .role-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .role-tile { font-size: 12px; padding: 8px 10px; }
            .mobile-group { flex-wrap: wrap; }
            .mobile-group select { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="signup-card">
        <a href="#" class="signup-brand">
            <span class="brand-mark">LF</span>
            <span>LoanFlow</span>
        </a>
        <div class="signup-title">Create your account</div>
        <div class="signup-sub">Choose your role and get started</div>

        <form id="signupForm" onsubmit="handleSignup(event)" novalidate>
            <div class="field">
                <label class="label" for="fullName">Full Name *</label>
                <input class="input" id="fullName" type="text" placeholder="Jordan Reyes" required />
            </div>

            <div class="field">
                <label class="label" for="email">Email *</label>
                <input class="input" id="email" type="email" placeholder="you@company.com" required />
            </div>

            <div class="field">
                <label class="label" for="mobile">Mobile Number * <span class="hint">(Indian numbers: 10 digits, starts with 6-9)</span></label>
                <div class="mobile-group">
                    <select id="countryCode">
                        <option value="+91" selected>🇮🇳 +91</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+61">🇦🇺 +61</option>
                        <option value="+81">🇯🇵 +81</option>
                        <option value="+86">🇨🇳 +86</option>
                    </select>
                    <input class="input" id="mobile" type="tel" placeholder="98765 43210" required />
                </div>
            </div>

            <div class="field">
                <label class="label" for="password">Password * <span class="hint">(min 8 chars, 1 uppercase, 1 lowercase, 1 number, 1 special)</span></label>
                <input class="input" id="password" type="password" placeholder="••••••••" required />
            </div>

            <div class="field">
                <label class="label" for="confirmPassword">Confirm Password *</label>
                <input class="input" id="confirmPassword" type="password" placeholder="••••••••" required />
            </div>

            <div class="field">
                <span class="label">Select your role *</span>
                <div class="role-grid" id="roleGrid">
                    <label class="role-tile selected" data-role="borrower">
                        <input type="radio" name="role" value="borrower" checked required />
                        <span class="role-emoji">👤</span>
                        <span>Borrower</span>
                    </label>
                    <label class="role-tile" data-role="admin">
                        <input type="radio" name="role" value="admin" />
                        <span class="role-emoji">🛡️</span>
                        <span>Admin</span>
                    </label>
                    <label class="role-tile" data-role="analyst">
                        <input type="radio" name="role" value="analyst" />
                        <span class="role-emoji">📊</span>
                        <span>Credit Analyst</span>
                    </label>
                    <label class="role-tile" data-role="approver">
                        <input type="radio" name="role" value="approver" />
                        <span class="role-emoji">✅</span>
                        <span>Credit Approver</span>
                    </label>
                </div>
            </div>

            <button class="btn btn-primary" type="submit">Create Account</button>
        </form>

        <div class="signup-footer">
            Already have an account? <a id="loginLink">Sign in</a>
        </div>
    </div>

    <div id="toast">
        <span class="toast-icon" id="toastIcon">✓</span>
        <span id="toastMsg">Account created successfully</span>
    </div>

    <script>
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastMsg').textContent = msg;
            icon.textContent = isError ? '✕' : '✓';
            icon.className = 'toast-icon' + (isError ? ' error' : '');
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => {
                t.classList.remove('show');
            }, 4000);
        }

        document.querySelectorAll('.role-tile').forEach(tile => {
            tile.addEventListener('click', function(e) {
                document.querySelectorAll('.role-tile').forEach(t => t.classList.remove('selected'));
                this.classList.add('selected');
                this.querySelector('input[type="radio"]').checked = true;
            });
        });

        document.querySelectorAll('.input').forEach(input => {
            input.addEventListener('focus', function() { this.classList.remove('invalid'); });
        });

        function handleSignup(e) {
            e.preventDefault();

            const nameEl = document.getElementById('fullName');
            const emailEl = document.getElementById('email');
            const mobileEl = document.getElementById('mobile');
            const countryCode = document.getElementById('countryCode').value;
            const passwordEl = document.getElementById('password');
            const confirmEl = document.getElementById('confirmPassword');
            const roleEl = document.querySelector('input[name="role"]:checked');

            document.querySelectorAll('.input').forEach(el => el.classList.remove('invalid'));

            const fullName = nameEl.value.trim();
            if (fullName.length < 2 || fullName.length > 50) {
                nameEl.classList.add('invalid');
                showToast('Name must be between 2 and 50 characters', true);
                nameEl.focus();
                return;
            }
            if (!/^[A-Za-z\\s\\-'.]+$/.test(fullName)) {
                nameEl.classList.add('invalid');
                showToast('Name can only contain letters, spaces, hyphens, and apostrophes', true);
                nameEl.focus();
                return;
            }

            if (!emailEl.validity.valid) {
                emailEl.classList.add('invalid');
                showToast('Please enter a valid email address (e.g., name@domain.com)', true);
                emailEl.focus();
                return;
            }

            const mobileRaw = mobileEl.value.trim();
            const digits = mobileRaw.replace(/\\D/g, '');
            if (countryCode === '+91') {
                if (digits.length !== 10) {
                    mobileEl.classList.add('invalid');
                    showToast('Indian mobile number must have exactly 10 digits', true);
                    mobileEl.focus();
                    return;
                }
                if (!/^[6-9]/.test(digits)) {
                    mobileEl.classList.add('invalid');
                    showToast('Indian mobile number must start with 6, 7, 8, or 9', true);
                    mobileEl.focus();
                    return;
                }
            } else {
                if (digits.length < 7) {
                    mobileEl.classList.add('invalid');
                    showToast('Please enter a valid mobile number', true);
                    mobileEl.focus();
                    return;
                }
            }

            const password = passwordEl.value;
            if (password.length < 8) {
                passwordEl.classList.add('invalid');
                showToast('Password must be at least 8 characters long', true);
                passwordEl.focus();
                return;
            }
            if (!/[a-z]/.test(password)) {
                passwordEl.classList.add('invalid');
                showToast('Password must contain at least one lowercase letter', true);
                passwordEl.focus();
                return;
            }
            if (!/[A-Z]/.test(password)) {
                passwordEl.classList.add('invalid');
                showToast('Password must contain at least one uppercase letter', true);
                passwordEl.focus();
                return;
            }
            if (!/\\d/.test(password)) {
                passwordEl.classList.add('invalid');
                showToast('Password must contain at least one number', true);
                passwordEl.focus();
                return;
            }
            if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
                passwordEl.classList.add('invalid');
                showToast('Password must contain at least one special character (!@#$%^&* etc.)', true);
                passwordEl.focus();
                return;
            }

            if (password !== confirmEl.value) {
                confirmEl.classList.add('invalid');
                showToast('Passwords do not match', true);
                confirmEl.focus();
                return;
            }

            if (!roleEl) {
                showToast('Please select a role', true);
                return;
            }

            const roleLabels = {
                borrower: 'Borrower',
                admin: 'Admin',
                analyst: 'Credit Analyst',
                approver: 'Credit Approver'
            };
            const role = roleEl.value;
            showToast(\`🎉 Welcome, \${fullName}! You're signed up as \${roleLabels[role] || role}.\`);
        }

        document.getElementById('loginLink').addEventListener('click', function(e) {
            e.preventDefault();
            showToast('🔐 Redirecting to Login...');
            setTimeout(() => {
                showToast('🚀 Navigate to Login page (mock)');
            }, 500);
        });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('fullName').value = 'Jordan Reyes';
            document.getElementById('email').value = 'jordan.reyes@acmecorp.com';
            document.getElementById('mobile').value = '9876543210';
            document.getElementById('password').value = 'Demo@1234';
            document.getElementById('confirmPassword').value = 'Demo@1234';
        });
    <\/script>
</body>
</html>`;

    // ================================================================
    // 4. INITIALIZE – render markdown, set iframes
    // ================================================================
    document.addEventListener('DOMContentLoaded', function() {
        // Configure marked for GFM (tables, breaks)
        marked.setOptions({
            gfm: true,
            breaks: true,
            headerIds: false
        });

        // Render BRD
        const rendered = document.getElementById('brdRendered');
        rendered.innerHTML = marked.parse(brdMarkdown);

        // Set iframes
        document.getElementById('loginIframe').srcdoc = loginHTML;
        document.getElementById('signupIframe').srcdoc = signupHTML;

        // Download BRD.md
        document.getElementById('downloadBrdBtn').addEventListener('click', function() {
            const blob = new Blob([brdMarkdown], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'BRD-LoanFlow.md';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // View raw
        document.getElementById('viewRawBtn').addEventListener('click', function() {
            const win = window.open();
            win.document.write('<pre>' + brdMarkdown.replace(/</g, '&lt;') + '</pre>');
            win.document.close();
        });

        // Open mockups in new tabs
        document.getElementById('loginOpenBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const win = window.open();
            win.document.write(loginHTML);
            win.document.close();
        });
        document.getElementById('signupOpenBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const win = window.open();
            win.document.write(signupHTML);
            win.document.close();
        });
    });
</script>
</body>
</html>
